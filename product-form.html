<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5B800">
  <title>Registrar Producto · Bodega Mateo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-bm-active="inventory" data-bm-title="Registrar Producto" data-bm-subtitle="Agrega un nuevo producto a tu inventario." data-bm-back="inventory.html">
  <main id="main-content" class="bm-content" tabindex="-1">
    <div class="bm-stack">
      
      <div class="bm-card mx-auto" style="max-width: 600px;">
        <form id="product-form" novalidate>
          
          <div class="mb-3">
            <label for="prod-name" class="form-label">Nombre del producto *</label>
            <input type="text" class="form-control" id="prod-name" required placeholder="Ej. Arroz Costeño 1 kg">
            <div class="invalid-feedback">Por favor, ingresa el nombre del producto.</div>
          </div>

          <div class="mb-3">
            <label for="prod-category" class="form-label">Categoría *</label>
            <select class="form-select" id="prod-category" required>
              <option value="" selected disabled>Selecciona una categoría...</option>
              <option value="primera">Primera necesidad</option>
              <option value="otros">Otros</option>
            </select>
            <div class="invalid-feedback">Selecciona una categoría válida.</div>
          </div>

          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="prod-stock" class="form-label">Cantidad inicial *</label>
              <input type="number" class="form-control" id="prod-stock" required min="0" value="0">
              <div class="invalid-feedback">Ingresa una cantidad mayor o igual a 0.</div>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="prod-min" class="form-label">Stock mínimo *</label>
              <input type="number" class="form-control" id="prod-min" required min="1" value="5">
              <div class="form-text">Nivel a partir del cual se generarán alertas.</div>
              <div class="invalid-feedback">El stock mínimo debe ser al menos 1.</div>
            </div>
          </div>

          <div class="mb-4">
            <label for="prod-price" class="form-label">Precio unitario (Opcional)</label>
            <div class="input-group">
              <span class="input-group-text">S/</span>
              <input type="number" class="form-control" id="prod-price" min="0" step="0.10" placeholder="0.00">
            </div>
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a href="inventory.html" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Producto</button>
          </div>

        </form>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
