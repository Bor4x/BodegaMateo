<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5B800">
  <title>Iniciar sesión · Bodega Mateo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="bm-login" data-bm-shell="off">

  <main id="main-content" class="bm-login__main" tabindex="-1">
    <section class="bm-card bm-login__card" aria-labelledby="login-title">

      <header class="text-center">
        <span class="bm-brand-mark bm-login__mark" aria-hidden="true"><i class="bi bi-basket2-fill"></i></span>
        <p class="bm-login__brand">Bodega Mateo</p>
        <p class="bm-login__system">Sistema de Gestión de Inventario y Reposición de Productos</p>
      </header>

      <hr class="bm-login__divider">

      <h1 id="login-title" class="bm-login__title">Iniciar sesión</h1>
      <p class="bm-login__lead">Ingresa tu contraseña para administrar tu bodega.</p>

      <form id="login-form" novalidate>
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group input-group-lg">
          <input type="password"
                 class="form-control"
                 id="password"
                 name="password"
                 placeholder="Ingresa tu contraseña"
                 autocomplete="current-password"
                 aria-describedby="login-error"
                 required>
          <button type="button"
                  class="btn btn-outline-secondary"
                  id="toggle-password"
                  aria-controls="password"
                  aria-pressed="false"
                  aria-label="Mostrar contraseña">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>

        <div class="bm-banner bm-login__error" id="login-error" role="alert" hidden>
          <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" id="login-submit">
          <span class="spinner-border spinner-border-sm" id="login-spinner" aria-hidden="true" hidden></span>
          <span id="login-submit-text">Ingresar</span>
        </button>
      </form>

      <div class="bm-note mt-3">
        <i class="bi bi-eye" aria-hidden="true"></i>
        <span><strong>Prototipo visual.</strong> Contraseña de demostración: <strong>mateo123</strong>. No se usa autenticación real.</span>
      </div>

      <p class="bm-login__foot">
        <i class="bi bi-lock-fill" aria-hidden="true"></i> Acceso exclusivo para la propietaria
      </p>

    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
