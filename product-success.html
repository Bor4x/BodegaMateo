<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5B800">
  <title>Producto Registrado · Bodega Mateo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-bm-active="inventory" data-bm-title="Registro Exitoso">
  <main id="main-content" class="bm-content" tabindex="-1">
    
    <div class="bm-card mx-auto text-center" style="max-width: 500px; margin-top: 2rem;">
      <div class="bm-empty__icon" style="background: var(--bm-normal-bg); color: var(--bm-normal-fg);">
        <i class="bi bi-check-lg" aria-hidden="true"></i>
      </div>
      
      <h2 class="mb-2">¡Producto guardado!</h2>
      <p class="text-muted mb-4" id="success-message">El producto se ha registrado correctamente en el inventario.</p>

      <div class="d-flex flex-column gap-2">
        <a href="inventory.html" class="btn btn-primary">Ver en el inventario</a>
        <a href="product-form.html" class="btn btn-outline-secondary">Registrar otro producto</a>
        <a href="dashboard.html" class="btn btn-link text-muted mt-2">Volver al inicio</a>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Script simple para leer el nombre del producto desde la URL y mostrarlo
    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var name = params.get('name');
      if (name) {
        document.getElementById('success-message').innerHTML = 'El producto <strong>' + name + '</strong> se ha registrado en el inventario.';
      }
    });
  </script>
</body>
</html>
