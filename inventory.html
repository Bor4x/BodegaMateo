<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5B800">
  <title>Existencias · Bodega Mateo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-bm-active="inventory" data-bm-title="Inventario" data-bm-subtitle="Consulta de existencias y productos.">
  <main id="main-content" class="bm-content" tabindex="-1">
    <div class="bm-stack">
      
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
        <div class="bm-search w-100" style="max-width: 400px;">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input type="search" class="form-control" id="inv-search" placeholder="Buscar producto por nombre...">
        </div>
        <a href="product-form.html" class="btn btn-primary text-nowrap">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo Producto
        </a>
      </div>

      <div class="bm-chips" id="inv-chips" data-bm-chips>
        <button class="bm-chip is-active" data-value="all" aria-pressed="true">Todos</button>
        <button class="bm-chip" data-value="primera" aria-pressed="false">Primera necesidad</button>
        <button class="bm-chip" data-value="otros" aria-pressed="false">Otros</button>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <p class="mb-0 text-muted"><strong id="inv-count">0</strong> productos encontrados</p>
      </div>

      <div class="bm-card-grid" id="inventory-grid">
        <!-- Renderizado por JS -->
      </div>

      <div class="bm-empty" id="inv-empty" hidden>
        <div class="bm-empty__icon"><i class="bi bi-box-seam" aria-hidden="true"></i></div>
        <h3>No se encontraron productos</h3>
        <p class="mb-0">Prueba con otra búsqueda o cambia los filtros.</p>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
